# Streamlit settings for the local dashboard. No secrets belong in this file
# (.streamlit/secrets.toml is git-ignored).

[browser]
gatherUsageStats = false

[server]
runOnSave = false

[client]
# Hide developer/deploy toolbar options; this dashboard is for local use only.
toolbarMode = "minimal"

# Restrained "instrument" theme (see docs/ux_redesign.md). Only keys supported by
# Streamlit 1.49, the minimum version, are used. Colours: neutral slate accent, so
# the classical (orange) and quantum (blue) figure colours stay unambiguous.
[theme]
base = "light"
primaryColor = "#33414c"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f3f3f0"
textColor = "#1b1b19"
borderColor = "#dddcd5"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "small"
buttonRadius = "small"
font = "sans-serif"
codeFont = "monospace"
baseFontSize = 15
headingFontSizes = ["1.6rem", "1.2rem", "1.02rem", "0.95rem", "0.9rem", "0.85rem"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
linkColor = "#1c5cab"
